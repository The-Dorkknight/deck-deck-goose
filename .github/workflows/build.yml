name: Build and test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.8", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests (simulated disks, stand-in flatpak/systemctl)
        run: python -m unittest discover -s tests -v
      - name: Bundled Zombie-Deck tests
        run: python -m unittest discover -s components/zombie-deck/tests -v
