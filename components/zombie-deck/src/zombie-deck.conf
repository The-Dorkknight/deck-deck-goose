# Zombie-Deck configuration  -  /etc/zombie-deck/zombie-deck.conf
# Plain KEY=VALUE, read by /bin/sh. Edit, then test with:  sudo zombie-deck test

# Platform profile to put back after wake.
#   restore      = whatever it was before sleep (default)
#   performance  = force "performance" (Steam's TDP slider only works on this)
#   balanced / quiet / off
ZD_PROFILE=restore

# TDP after wake.
#   restore = the exact SPL / SPPT / FPPT values from before sleep (default)
#   25      = any number of watts: sustained 25, slow 27, fast 30
#   off     = leave TDP alone
ZD_TDP=restore

# GPU power-management level (amdgpu power_dpm_force_performance_level).
#   restore | auto | off
ZD_GPU_DPM=restore

# CPU: un-park cores, restore governor, clock limits and energy preference.
#   restore | balance_performance | performance | off
ZD_CPU=restore

# ROG Ally built-in controller: if its USB MCU has not come back, re-authorise
# the hub it lives on.   auto | off
ZD_CONTROLLER=auto

# WiFi: if NetworkManager has not reconnected in ZD_WIFI_WAIT_SECONDS, toggle
# the radio.  "reload" additionally allows unloading and reloading the driver
# (mt7921e on the Ally) as a last resort.   auto | reload | off
ZD_WIFI=auto
ZD_WIFI_WAIT_SECONDS=15

# Seconds to wait after wake before the first pass (lets asusd / the EC finish
# flipping the profile around), and when to run the extra "double tap" passes.
ZD_SETTLE_SECONDS=3
ZD_DOUBLE_TAP_SECONDS="8 20"

# Log file (the journal gets a copy too: journalctl -t zombie-deck)
ZD_LOG=/var/log/zombie-deck.log

# On-screen brain: green pulsing while reviving, green flashing 3 s when done,
# red 5 s if something failed.   on | off
ZD_OVERLAY=on

# Crash guard: at boot, count unclean shutdowns that followed a revive; after
# two in a row ask whether to keep Zombie-Deck (default after the timeout:
# disable and go back to stock).   on | off
ZD_GUARD=on
ZD_GUARD_PROMPT_SECONDS=20
